# The checks every change must pass. scripts/verify.ps1 runs the same ones on a developer's machine.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compile, tests, style, static analysis, dependency audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # A database that exists only for this run. These are not secrets: nothing outside the job can reach it.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: fams_test
          MYSQL_USER: fams
          MYSQL_PASSWORD: ci-run-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      FAMS_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/fams_test?useSSL=false&allowPublicKeyRetrieval=true
      FAMS_TEST_DB_USER: fams
      FAMS_TEST_DB_PASSWORD: ci-run-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Let the schema create its triggers (binary logging is on by default)
        run: mysql -h 127.0.0.1 -uroot -pci-root-only -e "SET GLOBAL log_bin_trust_function_creators = 1"
      - name: Compile (warnings are errors), test, Checkstyle, SpotBugs
        working-directory: backend
        run: mvn -B verify
      - name: Known vulnerabilities in runtime libraries
        run: |
          (cd backend && mvn -B -q dependency:list -DincludeScope=runtime -DoutputFile=target/runtime-dependencies.txt)
          node scripts/audit-dependencies.mjs backend/target/runtime-dependencies.txt
      - name: Keep the test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/spotbugsXml.xml
            backend/target/checkstyle-result.xml

  frontend:
    name: Frontend (type check, lint, tests, build, dependency audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check, lint, unit tests, production build
        run: npm run check
      - name: Known vulnerabilities in shipped packages
        run: npm audit --omit=dev
